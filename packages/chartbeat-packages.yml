source: >-
  docs.chartbeat.com mobile SDK docs plus live registry metadata from
  registry.npmjs.org, trunk.cocoapods.org, jitpack.io, api.wordpress.org and the
  chartbeat-labs GitHub org.
note: >-
  Chartbeat's first-party client libraries are its mobile/analytics tracking SDKs
  (client-side data collection), not REST API client libraries. Chartbeat
  publishes no official server-side SDK for the Real-Time / Historical / Headline
  Testing / Conversion / Data Lab REST APIs — those are plain HTTPS + X-CB-AK.
  Browser-side loaders (chartbeat.js, chartbeat_mab.js, chartbeat_video.js,
  subscriptions.js) are CDN-distributed with no registry entry and are catalogued
  in components/chartbeat-components.yml.

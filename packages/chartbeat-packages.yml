summary:
  official_count: 6
  registries: [cocoapods, jitpack, npm, wordpress.org, github]
  server_side_sdk: false
  finding: >-
    Every first-party package Chartbeat ships is a data-COLLECTION library. There
    is no client library of any kind for the six read APIs it documents, in any
    language, so consuming the API means hand-rolling HTTP. Of the six official
    packages, three (CocoaPods pod, chartbeat-react-native-sdk, WordPress plugin)
    have not had a release in over two years.

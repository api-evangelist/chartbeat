  - id: rfc8615-well-known
    conforms: false
    evidence: No /.well-known/ document returned 200 on any Chartbeat host.
  - id: a2a-agent-card
    conforms: false
    evidence: >-
      /.well-known/agent-card.json and /.well-known/agent.json probed on

standards:
  - id: openapi
    conforms: false
    evidence: >-
      No OpenAPI/Swagger document is served on any Chartbeat host. Probed
      api.chartbeat.com and dashapi.chartbeat.com (/openapi.json, /openapi.yaml,
      /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc — all 503 behind
      the WAF) and docs.chartbeat.com (404). Docs are prose + tables only.
  - id: asyncapi
    conforms: false
    evidence: >-
      No event, streaming or webhook surface is published, so there is nothing
      an AsyncAPI could describe. "Push Alerts" in the docs is SDK-side tracking
      of push-notification referrers, not an outbound event delivery contract.
  - id: oauth2
    conforms: false
    evidence: >-
      Only a static account API key (X-CB-AK header, legacy apikey query param).
      No authorization server, no token endpoint, no scopes.
  - id: oidc
    conforms: false
    evidence: >-
      /.well-known/openid-configuration returns 503 on api.chartbeat.com and 404
      on chartbeat.com. SSO is an Enterprise dashboard feature, not an API auth
      surface.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      No application/problem+json envelope is documented. Errors surface as bare
      HTTP status codes; no error-code reference is published.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      /.well-known/security.txt returns 503 (api.chartbeat.com), 404

apis:
- name: Chartbeat Real-Time API
  description: >-
    Live audience and traffic data updated every three seconds — top pages,
    referrers, geographies, engaged time, loyalty, and live concurrent visitors
    — the data behind the Real-Time Dashboard. HTTP GET, JSON responses.
  humanURL: https://docs.chartbeat.com/cbp/api/real-time-apis
  baseURL: https://api.chartbeat.com/live/
  tags:
  - Real-Time
  - Traffic
  - Audience
  properties:
  - type: Documentation
    url: https://docs.chartbeat.com/cbp/api/real-time-apis
  - type: GettingStarted
    url: https://docs.chartbeat.com/cbp/api/real-time-apis/getting-started-with-our-real-time-api
- name: Chartbeat Historical API (Advanced Queries)
  description: >-
    Summary historical traffic data for a site over custom date ranges, via an
    asynchronous submit / status / results job model. Supports one-time and
    recurring queries with configurable metrics, dimensions, and filters,
    downloadable as JSON or CSV. Premium feature.
  humanURL: https://docs.chartbeat.com/cbp/api/historical-api
  baseURL: https://api.chartbeat.com/query/v2/
  tags:
  - Historical
  - Advanced Queries
  - Reporting
  properties:
  - type: Documentation
    url: https://docs.chartbeat.com/cbp/api/historical-api
  - type: GettingStarted
    url: https://docs.chartbeat.com/cbp/api/historical-api/getting-started-with-our-historical-api
- name: Chartbeat Headline Testing API
  description: >-
    Programmatic access to headline testing data — raw variant-level data,
    summary reports, and variant reports for headline tests run over a custom
    time range.
  humanURL: https://docs.chartbeat.com/cbp/api/headline-testing-api
  baseURL: https://api.chartbeat.com/
  tags:
  - Headline Testing
  - Optimization
  properties:
  - type: Documentation
    url: https://docs.chartbeat.com/cbp/api/headline-testing-api
- name: Chartbeat Conversion API
  description: >-
    Retrieve the top articles that drove a given conversion event for a
    specified host and date range, with counts attributed per path.
  humanURL: https://docs.chartbeat.com/cbp/api/conversion-api
  baseURL: https://api.chartbeat.com/
  tags:
  - Conversion
  - Attribution
  properties:
  - type: Documentation
    url: https://docs.chartbeat.com/cbp/api/conversion-api
- name: Chartbeat Data Lab API
  description: >-

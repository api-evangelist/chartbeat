aid: chartbeat
name: Chartbeat
description: >-
  Chartbeat is a real-time content analytics and audience-engagement platform
  built for digital publishers, media brands, and editorial teams. It measures
  how audiences read, watch, and engage with content the moment it is published,
  reporting live traffic, engaged time, loyalty, video engagement, and headline
  performance. Beyond its dashboards, Chartbeat exposes public HTTP APIs: a
  Real-Time API for live traffic and video data updated every three seconds, a
  Historical (Advanced Queries) API for summary traffic reporting, and Headline
  Testing, Conversion, and Data Lab APIs, plus JavaScript, iOS, Android, and
  React Native tracking SDKs for data collection. Authentication is via an
  account API key sent in the X-CB-AK header.
